<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenGenoScope — Erreur</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:40px 20px;max-width:500px}
.logo{font-size:24px;font-weight:700;color:#0f172a;margin-bottom:32px}
.logo span{color:#0d9488}
.code{font-size:72px;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:16px}
h1{font-size:22px;font-weight:600;color:#0f172a;margin-bottom:10px}
p{font-size:14px;color:#64748b;line-height:1.7;margin-bottom:28px}
.btn{display:inline-block;padding:11px 24px;background:#0d9488;color:white;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;margin:6px}
.btn-outline{background:white;color:#374151;border:1px solid #d1d5db}
.badge{display:inline-block;background:#fef2f2;color:#dc2626;font-size:12px;padding:4px 12px;border-radius:20px;margin-bottom:20px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Sen<span>Geno</span>Scope</div>
  <div class="code">500</div>
  <div class="badge">Erreur serveur interne</div>
  <h1>Quelque chose s'est mal passé</h1>
  <p>Notre équipe a été notifiée et travaille à résoudre le problème. Vos données sont en sécurité. Réessayez dans quelques instants.</p>
  <a href="/app" class="btn">Retour à la plateforme</a>
  <a href="/login" class="btn btn-outline">Se reconnecter</a>
</div>
</body>
</html>
