<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenGenoScope — Connexion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:20px}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:26px;font-weight:700;color:#0f172a}
.logo h1 span{color:#0d9488}
.logo p{font-size:13px;color:#64748b;margin-top:4px}
.card{background:white;border-radius:16px;border:1px solid #e2e8f0;padding:32px}
.tabs{display:flex;margin-bottom:24px;border-bottom:1px solid #e2e8f0}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:#64748b;transition:all .2s}
.tab.active{color:#0d9488;border-bottom-color:#0d9488;font-weight:500}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:6px}
input,select{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-primary{background:#0d9488;color:white}
.btn-primary:hover{background:#0f766e}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>Sen<span>Geno</span>Scope</h1>
    <p>Oncogénomique clinique — Plateforme sécurisée</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="showTab('login')">Connexion</div>
      <div class="tab" onclick="showTab('register')">Créer un compte</div>
    </div>

    <div id="msg-error" class="error"></div>
    <div id="msg-success" class="success"></div>

    <!-- LOGIN -->
    <div id="tab-login">
      <div class="form-group">
        <label>Email professionnel</label>
        <input type="email" id="login-email" placeholder="medecin@hopital.sn">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="doLogin()" id="btn-login">Se connecter</button>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>Prénom et nom</label>
          <input type="text" id="reg-name" placeholder="Dr. Moustapha Gassama">
        </div>
        <div class="form-group">
          <label>Rôle</label>
          <select id="reg-role">
            <option value="medecin">Médecin</option>
            <option value="biologiste">Biologiste</option>
            <option value="chercheur">Chercheur</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Institution / Hôpital</label>
        <input type="text" id="reg-institution" placeholder="CHU de Dakar, Institut Curie...">
      </div>
      <div class="form-group">
        <label>Email professionnel</label>
        <input type="email" id="reg-email" placeholder="medecin@hopital.sn">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="reg-password" placeholder="Min. 8 caractères">
        </div>
        <div class="form-group">
          <label>Confirmer</label>
          <input type="password" id="reg-confirm" placeholder="••••••••">
        </div>
      </div>
      <button class="btn btn-primary" onclick="doRegister()" id="btn-register">Créer mon compte</button>
    </div>
  </div>
</div>

<script>
function showTab(t){
  document.getElementById('tab-login').style.display = t==='login'?'block':'none';
  document.getElementById('tab-register').style.display = t==='register'?'block':'none';
  document.querySelectorAll('.tab').forEach(function(el,i){el.classList.toggle('active',(t==='login'&&i===0)||(t==='register'&&i===1));});
  hideMsg();
}

function showError(msg){var el=document.getElementById('msg-error');el.textContent=msg;el.style.display='block';document.getElementById('msg-success').style.display='none';}
function showSuccess(msg){var el=document.getElementById('msg-success');el.textContent=msg;el.style.display='block';document.getElementById('msg-error').style.display='none';}
function hideMsg(){document.getElementById('msg-error').style.display='none';document.getElementById('msg-success').style.display='none';}

async function doLogin(){
  var email=document.getElementById('login-email').value.trim();
  var password=document.getElementById('login-password').value;
  var btn=document.getElementById('btn-login');
  if(!email||!password){showError('Email et mot de passe requis');return;}
  btn.innerHTML='<span class="spinner"></span>Connexion...';btn.disabled=true;
  try{
    var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
    var d=await r.json();
    if(d.success){showSuccess('Connexion réussie!');setTimeout(function(){window.location.href='/app';},800);}
    else showError(d.error||'Erreur de connexion');
  }catch(e){showError('Erreur réseau: '+e.message);}
  btn.innerHTML='Se connecter';btn.disabled=false;
}

async function doRegister(){
  var name=document.getElementById('reg-name').value.trim();
  var role=document.getElementById('reg-role').value;
  var inst=document.getElementById('reg-institution').value.trim();
  var email=document.getElementById('reg-email').value.trim();
  var pass=document.getElementById('reg-password').value;
  var conf=document.getElementById('reg-confirm').value;
  var btn=document.getElementById('btn-register');
  if(!email||!pass){showError('Email et mot de passe requis');return;}
  if(pass!==conf){showError('Les mots de passe ne correspondent pas');return;}
  if(pass.length<8){showError('Mot de passe minimum 8 caractères');return;}
  btn.innerHTML='<span class="spinner"></span>Création...';btn.disabled=true;
  try{
    var r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass,full_name:name,role:role,institution:inst})});
    var d=await r.json();
    if(d.success){showSuccess('Compte créé ! Vérifiez votre email puis connectez-vous.');showTab('login');}
    else showError(d.error||'Erreur inscription');
  }catch(e){showError('Erreur réseau: '+e.message);}
  btn.innerHTML='Créer mon compte';btn.disabled=false;
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=document.getElementById('tab-login').style.display;if(t!=='none')doLogin();else doRegister();}});
</script>
</body>
</html>
