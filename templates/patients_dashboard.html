<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenGenoScope — Dossiers patients</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:700;color:#0f172a}
.logo span{color:#0d9488}
.back-btn{font-size:13px;color:#0d9488;text-decoration:none;padding:6px 12px;border:1px solid #0d9488;border-radius:8px}
.container{max-width:1100px;margin:0 auto;padding:24px}
h1{font-size:22px;font-weight:600;color:#0f172a;margin-bottom:4px}
.subtitle{font-size:13px;color:#64748b;margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-lbl{font-size:12px;color:#64748b;margin-top:2px}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;padding:9px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none}
.search-input:focus{border-color:#0d9488}
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer}
.btn-primary{background:#0d9488;color:white}
.btn-primary:hover{background:#0f766e}
.btn-outline{background:white;color:#374151;border:1px solid #d1d5db}
.btn-outline:hover{background:#f9fafb}
.patients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.patient-card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;text-decoration:none;display:block;color:inherit}
.patient-card:hover{border-color:#0d9488;box-shadow:0 4px 12px rgba(13,148,136,.1)}
.patient-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.patient-avatar{width:40px;height:40px;border-radius:50%;background:#0d948822;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#0d9488}
.patient-code{font-size:11px;background:#f1f5f9;padding:2px 8px;border-radius:8px;color:#64748b}
.patient-name{font-size:15px;font-weight:600;color:#0f172a;margin-bottom:2px}
.patient-cancer{font-size:12px;color:#64748b}
.patient-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.meta-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#374151}
.analyses-count{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9}
.count-badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty h3{font-size:18px;margin-bottom:8px;color:#64748b}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:16px;padding:28px;width:100%;max-width:480px;margin:20px}
.modal h2{font-size:18px;font-weight:600;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#0d9488}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.loading{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Sen<span>Geno</span>Scope</div>
    <a href="/app" class="back-btn">← Plateforme</a>
  </div>
  <div style="font-size:13px;color:#64748b" id="user-info">Chargement...</div>
</div>

<div class="container">
  <h1>Dossiers patients</h1>
  <p class="subtitle">Gérez et consultez les dossiers génomiques de vos patients</p>

  <div class="stats-grid">
    <div class="stat"><div class="stat-num" id="stat-total" style="color:#0d9488">—</div><div class="stat-lbl">Patients</div></div>
    <div class="stat"><div class="stat-num" id="stat-analyses" style="color:#7c3aed">—</div><div class="stat-lbl">Analyses</div></div>
    <div class="stat"><div class="stat-num" id="stat-recent" style="color:#2563eb">—</div><div class="stat-lbl">Ce mois</div></div>
    <div class="stat"><div class="stat-num" id="stat-types" style="color:#ea580c">5</div><div class="stat-lbl">Types d'analyse</div></div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" placeholder="Rechercher par nom, code, cancer..." id="search-input" oninput="filterPatients()">
    <select id="filter-cancer" onchange="filterPatients()" style="padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none">
      <option value="">Tous les cancers</option>
      <option>Sein</option><option>Poumon</option><option>Colorectal</option>
      <option>Ovaire</option><option>Prostate</option><option>Leucémie</option>
      <option>Lymphome</option><option>Mélanome</option><option>Pancréas</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">+ Nouveau patient</button>
  </div>

  <div id="patients-container" class="loading">Chargement des dossiers...</div>
</div>

<!-- Modal nouveau patient -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Nouveau dossier patient</h2>
    <div id="modal-error" style="color:#dc2626;font-size:13px;margin-bottom:12px;display:none"></div>
    <div class="form-row">
      <div class="form-group"><label>Code patient *</label><input id="f-code" placeholder="PAT-001"></div>
      <div class="form-group"><label>Sexe</label>
        <select id="f-sex"><option value="">—</option><option value="M">Masculin</option><option value="F">Féminin</option><option value="Autre">Autre</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Prénom</label><input id="f-first" placeholder="Aminata"></div>
      <div class="form-group"><label>Nom</label><input id="f-last" placeholder="Diallo"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Type de cancer</label><input id="f-cancer" placeholder="Sein, Poumon..."></div>
      <div class="form-group"><label>Stade</label>
        <select id="f-stage"><option value="">—</option><option>I</option><option>II</option><option>III</option><option>IV</option></select>
      </div>
    </div>
    <div class="form-group"><label>Date de naissance</label><input type="date" id="f-dob"></div>
    <div class="form-group"><label>Notes cliniques</label><textarea id="f-notes" rows="2" placeholder="Antécédents, traitements en cours..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="createPatient()" id="btn-create">Créer le dossier</button>
    </div>
  </div>
</div>

<script>
var allPatients = [];
var allAnalyses = [];

async function loadData() {
  try {
    var r = await fetch('/api/patients');
    var d = await r.json();
    if (!d.success) { document.getElementById('patients-container').innerHTML = '<div class="empty"><h3>Erreur</h3><p>' + (d.error||'') + '</p></div>'; return; }
    allPatients = d.patients || [];

    // Charger stats
    var totalAnalyses = 0;
    var thisMonth = 0;
    var now = new Date();
    allPatients.forEach(function(p) {
      var d2 = new Date(p.created_at);
      if (d2.getMonth() === now.getMonth() && d2.getFullYear() === now.getFullYear()) thisMonth++;
    });

    document.getElementById('stat-total').textContent = allPatients.length;
    document.getElementById('stat-recent').textContent = thisMonth;

    // User info
    var me = await fetch('/api/auth/me');
    var md = await me.json();
    if (md.authenticated) document.getElementById('user-info').textContent = md.name || md.email;

    renderPatients(allPatients);
  } catch(e) {
    document.getElementById('patients-container').innerHTML = '<div class="empty"><h3>Erreur de chargement</h3><p>' + e.message + '</p></div>';
  }
}

function renderPatients(patients) {
  var container = document.getElementById('patients-container');
  if (!patients.length) {
    container.innerHTML = '<div class="empty"><h3>Aucun dossier patient</h3><p>Créez votre premier dossier patient ou sauvegardez une analyse depuis la plateforme.</p></div>';
    return;
  }
  document.getElementById('stat-total').textContent = patients.length;
  var html = '<div class="patients-grid">';
  patients.forEach(function(p) {
    var initials = ((p.first_name||'?')[0] + (p.last_name||'?')[0]).toUpperCase();
    var name = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Patient anonyme';
    var age = '';
    if (p.date_of_birth) {
      var y = new Date().getFullYear() - new Date(p.date_of_birth).getFullYear();
      age = y + ' ans';
    }
    html += '<a class="patient-card" href="/dashboard/patient/' + p.id + '">';
    html += '<div class="patient-header">';
    html += '<div class="patient-avatar">' + initials + '</div>';
    html += '<span class="patient-code">' + p.patient_code + '</span>';
    html += '</div>';
    html += '<div class="patient-name">' + name + '</div>';
    html += '<div class="patient-cancer">' + (p.cancer_type || 'Cancer non précisé') + (p.stage ? ' — Stade ' + p.stage : '') + '</div>';
    html += '<div class="patient-meta">';
    if (age) html += '<span class="meta-tag">' + age + '</span>';
    if (p.sex) html += '<span class="meta-tag">' + (p.sex === 'M' ? 'Homme' : p.sex === 'F' ? 'Femme' : p.sex) + '</span>';
    var dateStr = new Date(p.created_at).toLocaleDateString('fr-FR');
    html += '<span class="meta-tag">Créé le ' + dateStr + '</span>';
    html += '</div>';
    html += '<div class="analyses-count">';
    var types = ['ngs','cnv','fusions','signatures','mtb'];
    var colors = {'ngs':'#0d9488','cnv':'#7c3aed','fusions':'#2563eb','signatures':'#059669','mtb':'#1e3a5f'};
    var labels = {'ngs':'NGS','cnv':'CNV','fusions':'Fusions','signatures':'Sig.','mtb':'MTB'};
    types.forEach(function(t){ html += '<span class="count-badge" style="background:' + colors[t] + '22;color:' + colors[t] + '">' + labels[t] + '</span>'; });
    html += '</div>';
    html += '</a>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterPatients() {
  var q = document.getElementById('search-input').value.toLowerCase();
  var cancer = document.getElementById('filter-cancer').value.toLowerCase();
  var filtered = allPatients.filter(function(p) {
    var matchQ = !q || (p.patient_code||'').toLowerCase().includes(q) ||
      (p.first_name||'').toLowerCase().includes(q) ||
      (p.last_name||'').toLowerCase().includes(q) ||
      (p.cancer_type||'').toLowerCase().includes(q);
    var matchC = !cancer || (p.cancer_type||'').toLowerCase().includes(cancer);
    return matchQ && matchC;
  });
  renderPatients(filtered);
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function createPatient() {
  var code = document.getElementById('f-code').value.trim();
  if (!code) { document.getElementById('modal-error').textContent = 'Code patient requis'; document.getElementById('modal-error').style.display='block'; return; }
  var btn = document.getElementById('btn-create');
  btn.textContent = 'Création...'; btn.disabled = true;
  try {
    var dob = document.getElementById('f-dob').value;
    var body = {
      patient_code: code,
      first_name: document.getElementById('f-first').value.trim(),
      last_name: document.getElementById('f-last').value.trim(),
      sex: document.getElementById('f-sex').value,
      cancer_type: document.getElementById('f-cancer').value.trim(),
      stage: document.getElementById('f-stage').value,
      notes: document.getElementById('f-notes').value.trim()
    };
    if (dob) body.date_of_birth = dob;
    var r = await fetch('/api/patients', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    var d = await r.json();
    if (d.success) {
      closeModal();
      localStorage.setItem('sgs_current_patient', d.patient.id);
      localStorage.setItem('sgs_current_patient_code', code);
      window.location.href = '/dashboard/patient/' + d.patient.id;
    } else {
      document.getElementById('modal-error').textContent = d.error || 'Erreur';
      document.getElementById('modal-error').style.display = 'block';
    }
  } catch(e) { document.getElementById('modal-error').textContent = e.message; document.getElementById('modal-error').style.display='block'; }
  btn.textContent = 'Créer le dossier'; btn.disabled = false;
}

document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
loadData();
</script>
</body>
</html>
